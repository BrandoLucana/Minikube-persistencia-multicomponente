apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: backend 
  namespace: practica-s11 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      app: backend 
  template: 
    metadata: 
      labels: 
        app: backend 
    spec: 
      containers: 
        - name: backend 
          image: jemith28/mi-backend-s11:latest 
          ports: 
            - containerPort: 8080 
          envFrom: 
            - configMapRef: 
                name: app-config 
            - secretRef: 
                name: db-secret 
--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: backend-service 
  namespace: practica-s11 
spec: 
  type: NodePort 
  selector: 
    app: backend 
  ports: 
    - port: 8080 
      targetPort: 8080 
      nodePort: 30200 
